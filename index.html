    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before styles load, avoiding a bright flash on startup.
      (() => {
        let preference;
        try { preference = localStorage.getItem('solid-section-theme'); } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f1726' : '#f5f7fc');
      })();
    </script>
